<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Lobby — Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN / SETUP -------------------------------------------------------- -->
<div id="gate" class="gate hidden">
  <form class="card gate-card" id="gate-form">
    <img id="gate-logo" class="gate-logo hidden" alt="">
    <h1 id="gate-title">Smart Lobby</h1>
    <p class="muted" id="gate-sub">Sign in to the admin dashboard</p>
    <label class="field" id="gate-org-wrap" hidden><span>Organisation name</span><input class="input" id="gate-org"></label>
    <label class="field" id="gate-name-wrap" hidden><span>Your name</span><input class="input" id="gate-name"></label>
    <label class="field"><span>Email</span><input class="input" id="gate-email" type="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input class="input" id="gate-pass" type="password" autocomplete="current-password" required></label>
    <div id="gate-error" class="notice error hidden"></div>
    <button class="btn" style="width:100%" id="gate-submit">Sign in</button>
  </form>
</div>

<!-- APP ------------------------------------------------------------------ -->
<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="brand"><span class="brand-mark" id="brand-mark">SL</span><span id="brand-name">Smart Lobby</span></div>
    <nav id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="visits">Visits</button>
      <button data-view="visitors">Visitor registry</button>
      <button data-view="drivers">Drivers</button>
      <button data-view="deliveries">Deliveries</button>
      <button data-view="staff">Staff</button>
      <button data-view="projects">Projects</button>

      <!--
        Two parents with children. A parent that has no page of its own opens
        its first child; Settings keeps its own page and lists its panels.
        Children are either a whole view (data-view) or one panel on the
        settings page to open and jump to (data-section).
      -->
      <button data-view="signin" data-group="signin">Sign-in setup</button>
      <div class="subnav" data-for="signin" hidden>
        <button data-view="induction">Induction decks</button>
        <button data-view="documents">Documents</button>
        <button data-view="vtypes">Visitor types</button>
        <button data-view="badges">Badges</button>
      </div>

      <button data-view="reports">Reports</button>
      <button data-view="settings" data-group="settings">Settings</button>
      <div class="subnav" data-for="settings" hidden>
        <button data-section="branding">Branding</button>
        <button data-section="details">Visitor form</button>
        <button data-section="flow">Kiosk sign-in flow</button>
        <button data-section="badges">ID badge printing</button>
        <button data-section="induction">Induction</button>
        <button data-section="deliveries">Deliveries</button>
        <button data-section="access">Access control</button>
        <button data-section="notifications">Notifications</button>
        <button data-view="devices">Devices</button>
        <button data-view="printers">Printers</button>
        <button data-view="access">Access &amp; doors</button>
        <button data-view="locations">Locations</button>
        <button data-section="board">Live on-site board</button>
        <button data-section="retention">Data retention &amp; privacy</button>
        <button data-section="backups">Backups</button>
        <button data-section="deleted">Deleted records</button>
        <button data-section="users">Admin users</button>
        <button data-section="activity">Activity log</button>
      </div>
    </nav>
    <div class="side-foot">
      <a class="btn ghost" href="/kiosk/" target="_blank" rel="noopener">Open kiosk ↗</a>
      <!-- Only once the board has been switched on: a link to a page that
           404s is worse than no link. Filled in by applyBranding(). -->
      <a class="btn ghost hidden" id="open-board" target="_blank" rel="noopener">Open board ↗</a>
      <button class="btn link" id="logout">Sign out</button>
      <div class="muted" id="who"></div>
    </div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="admin.js"></script>
</body>
</html>
