<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>On site now</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="board.css">
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <img id="logo" class="logo" alt="" hidden>
    <div>
      <h1 id="title">On site now</h1>
      <div class="muted" id="subtitle">Loading…</div>
    </div>
  </div>
  <div class="bar-right">
    <button class="mode-btn" id="rollcall-toggle" type="button">Roll call</button>
    <div class="count"><span id="count">–</span><small>on site</small></div>
    <div class="clock" id="clock"></div>
  </div>
</header>

<!-- The camera, when one is set up. Click to make it big. -->
<div id="camera-box" class="camera-box hidden">
  <div class="camera-label" id="camera-label"></div>
  <div id="camera-holder"></div>
</div>

<!--
  A badge printer somebody has marked as not printing. Above the lists because
  it is the one thing on this screen that wants doing something about, and
  because the alternative is finding out one confused visitor at a time.
-->
<div id="printer-down" class="printer-down hidden"></div>

<main>
  <section id="arrivals-wrap" hidden>
    <h2 class="group">Just arrived</h2>
    <div class="grid" id="arrivals"></div>
  </section>

  <section>
    <h2 class="group" id="onsite-heading">On site</h2>
    <p class="rollcall-note hidden" id="rollcall-note"></p>
    <div class="grid" id="onsite"></div>
  </section>

  <section id="left-wrap" hidden>
    <h2 class="group">Signed out today</h2>
    <div class="grid dim" id="left"></div>
  </section>
</main>

<div id="offline" class="offline hidden">Not connected — showing the last update</div>

<!-- A face, full size. Reception is asked "is that the one who came Tuesday"
     often enough that a thumbnail on a wall board is not an answer. -->
<div id="zoom" hidden role="dialog" aria-modal="true" aria-label="Visitor photo">
  <div>
    <img id="zoom-img" alt="">
    <div class="zoom-name" id="zoom-name"></div>
    <div class="zoom-sub" id="zoom-sub"></div>
  </div>
</div>

<script src="board.js"></script>
</body>
</html>
